<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>编辑文章 - CF-blog后台</title>
    <link rel="icon" type="image/x-icon" href="https://cdn.jsdelivr.net/gh/gdtool/zhaopp/cfblog/favicon.ico" />
	<link rel="shortcut icon" type="image/x-icon"  href="https://cdn.jsdelivr.net/gh/gdtool/zhaopp/cfblog/favicon.ico"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">
    <!--//<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/editor.md@1.5.0/examples/css/style.css" />-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/editor.md@1.5.0/css/editormd.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.9.4/dist/css/bootstrap-select.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/css/bootstrap-select.min.css">
    
    <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/bootstrap-select.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.14/dist/js/i18n/defaults-zh_CN.min.js"></script>
	<style>
		.bootstrap-select>.dropdown-toggle {
			z-index:auto;
		}
		.writer-shell {
			padding: 0 20px 40px;
		}
		.writer-sidebar {
			border-right: 1px solid #f3f3f3;
			min-height: calc(100vh - 140px);
		}
		.panel.writer-card {
			border-radius: 12px;
			border: none;
			box-shadow: 0 8px 24px rgba(15,23,42,0.08);
		}
		.writer-card .panel-heading {
			background: #fff;
			border-bottom: 1px solid #f5f5f5;
			padding: 16px 20px;
		}
		.writer-card .panel-title {
			font-size: 16px;
			font-weight: 600;
		}
		.notebook-panel .list-group,
		.note-panel .note-list {
			max-height: calc(100vh - 220px);
			overflow-y: auto;
		}
		.notebook-item,
		.note-item {
			cursor: pointer;
			border: 1px solid transparent;
			border-radius: 8px;
			padding: 12px 14px;
			margin-bottom: 8px;
			transition: all .2s ease;
			background: #fff;
		}
		.notebook-item.active,
		.note-item.active,
		.notebook-item:hover,
		.note-item:hover {
			border-color: #3b82f6;
			box-shadow: 0 4px 12px rgba(59,130,246,0.15);
		}
		.notebook-item .meta,
		.note-item .meta {
			font-size: 12px;
			color: #9ca3af;
		}
		.notebook-actions,
		.note-actions {
			display: flex;
			gap: 4px;
		}
		.notebook-actions .btn-link,
		.note-actions .btn-link {
			padding: 0;
			font-size: 12px;
			color: #6b7280;
		}
		.tag-editor {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			min-height: 42px;
			padding: 6px 10px;
			border: 1px solid #d1d5db;
			border-radius: 8px;
			gap: 6px;
		}
		.tag-editor input {
			border: none;
			flex: 1;
			min-width: 120px;
			outline: none;
		}
		.tag-pill {
			display: inline-flex;
			align-items: center;
			gap: 4px;
			border-radius: 999px;
			background: #eef2ff;
			color: #4338ca;
			padding: 4px 10px;
			font-size: 12px;
		}
		.tag-pill .tag-remove {
			border: none;
			background: transparent;
			color: inherit;
			font-size: 12px;
			line-height: 1;
			padding: 0;
		}
		.privacy-toggle {
			display: flex;
			align-items: center;
			gap: 10px;
		}
		.privacy-hint {
			font-size: 12px;
			color: #6b7280;
		}
		.note-empty,
		.notebook-empty {
			text-align: center;
			padding: 40px 10px;
			color: #9ca3af;
		}
		.writer-shell .btn-round {
			border-radius: 999px;
			padding: 6px 14px;
		}
	</style>
	
</head>
<body>

<nav class="navbar navbar-default" role="navigation">
	<div class="container-fluid">

	<div>
		<ul id="myTab" class="nav nav-tabs">
			<li class="active">
				<a href="/admin/" >返回文章</a>
			</li>
		</ul>
	</div>
	</div>
</nav>
<div id="myTabContent" class="tab-content" style="padding-top: 60px;">

		<div class="writer-shell container-fluid">
			<div class="row">
				<div class="col-md-3 col-lg-2 writer-sidebar">
					<div class="panel writer-card notebook-panel">
						<div class="panel-heading clearfix">
							<span class="panel-title pull-left">文集</span>
							<button type="button" class="btn btn-link btn-xs pull-right" id="btnNewNotebook">
								<span class="glyphicon glyphicon-plus"></span> 新建文集
							</button>
						</div>
						<div class="panel-body">
							<div id="notebookList" class="notebook-list"></div>
							<div class="notebook-empty" id="notebookEmpty" style="display:none;">暂无文集，创建一个开启写作吧</div>
						</div>
					</div>
				</div>
				<div class="col-md-3 col-lg-3 writer-sidebar">
					<div class="panel writer-card note-panel">
						<div class="panel-heading clearfix">
							<span class="panel-title pull-left" id="currentNotebookTitle">全部笔记</span>
							<button type="button" class="btn btn-primary btn-round btn-xs pull-right" id="btnNewNote">
								<span class="glyphicon glyphicon-plus"></span> 新建笔记
							</button>
						</div>
						<div class="panel-body">
							<div class="note-list" id="noteList"></div>
							<div class="note-empty" id="noteEmpty" style="display:none;">请选择文集后开始创作</div>
						</div>
					</div>
				</div>
				<div class="col-md-6 col-lg-7">
					<div class="panel writer-card editor-panel">
						<div class="panel-heading">
							<span class="panel-title">编辑文章</span>
						</div>
						<div class="panel-body">
							<form id="editForm" class="form" action="/">
								<input type="hidden" class="form-control" name="id" id="id" readonly required="true">
								<input type="hidden" class="form-control" name="notebookId" id="notebookId" value="">
								<input type="hidden" class="form-control" name="visibility" id="visibility" value="public">
								<div class="form-group">
									<label for="title">标题</label>
									<input type="text" class="form-control" name="title" id="title" placeholder="输入标题" required="true">
								</div>
								<div class="row">
									<div class="col-sm-6">
										<div class="form-group">
											<label for="img">特色图片</label>
											<input type="url" class="form-control" name="img" id="img" placeholder="图片地址">
										</div>
									</div>
									<div class="col-sm-6">
										<div class="form-group">
											<label for="link">永久链接</label>
											<input type="text" class="form-control" name="link" id="link" placeholder="mylink" required="true">
										</div>
									</div>
								</div>
								<div class="row">
									<div class="col-sm-6">
										<div class="form-group">
											<label for="createDate">创建日期</label>
											<input type="datetime-local" class="form-control" id="createDate" name="createDate" required="true">
										</div>
									</div>
									<div class="col-sm-6">
										<div class="form-group">
											<label for="category">分类</label>
											<select class="selectpicker" multiple name="category[]" id="category"></select>
										</div>
									</div>
								</div>
								<div class="form-group">
									<label>标签</label>
									<div class="tag-editor" id="tagEditor">
										<div id="tagPillContainer"></div>
										<input type="text" id="tagInput" placeholder="输入后按 Enter">
									</div>
									<input type="hidden" name="tags" id="tags" placeholder="标签1,标签2">
								</div>
								<div class="form-group">
									<label>公开状态</label>
									<div class="privacy-toggle">
										<label class="checkbox-inline">
											<input type="checkbox" id="visibilityToggle"> 设为私密
										</label>
										<span class="label label-success" id="visibilityLabel">公开</span>
									</div>
									<p class="privacy-hint" id="privacyMessage">公开文章任何人均可访问，无需登录。</p>
								</div>
								<div class="row">
									<div class="col-sm-6">
										<div class="form-group">
											<label for="priority">权重</label>
											<input type="text" class="form-control" name="priority" id="priority" value="0.5" placeholder="0-1">
										</div>
									</div>
									<div class="col-sm-6">
										<div class="form-group">
											<label for="changefreq">更新频率</label>
											<select class="form-control" id="changefreq" name="changefreq">
												<option value="daily">daily</option>
												<option value="hourly">hourly</option>
												<option value="weekly">weekly</option>
												<option value="monthly">monthly</option>
												<option value="yearly">yearly</option>
												<option value="never">never</option>
												<option value="always">always</option>
											</select>
										</div>
									</div>
								</div>
								<div class="form-actions text-right">
									<button type="button" id="btn_saveEdit" class="btn btn-primary" onclick="saveEdit()">保存</button>
									<button type="button" id="btn_delete" class="btn btn-warning" onclick="deleteArticle()">删除</button>
								</div>
								<div id="content"><textarea style="display:none;"></textarea></div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>

</div>

<div class="modal fade" id="notebookModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title" id="notebookModalLabel">新建文集</h4>
			</div>
			<div class="modal-body">
				<input type="text" class="form-control" id="notebookNameInput" placeholder="输入文集名称">
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				<button type="button" class="btn btn-primary" id="notebookModalConfirm">保存</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="noteModal" tabindex="-1" role="dialog" aria-hidden="true">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title" id="noteModalLabel">重命名笔记</h4>
			</div>
			<div class="modal-body">
				<input type="text" class="form-control" id="noteTitleInput" placeholder="新的笔记标题">
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
				<button type="button" class="btn btn-primary" id="noteModalConfirm">保存</button>
			</div>
		</div>
	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/editor.md@1.5.0/editormd.js"></script>   
<script type="text/javascript">
	var NOTEBOOK_UNFILED_ID = "__notebook_unfiled";
	var state = { notebooks: [], notes: [], selectedNotebookId: NOTEBOOK_UNFILED_ID, selectedNoteId: null };
	var tagState = [];
	var mdEditor;
	var articleJson = <!--{articleJson}-->;
	var categoryJson = <!--{categoryJson}-->;

	$(function() {
		$('#myTab li:eq(0) a').tab('show');
		initEditor(articleJson);
		initCategoryOptions();
		hydrateForm(articleJson);
		bindUI();
		loadNotebooks().then(function(){
			return loadNotes(state.selectedNotebookId);
		}).then(function(){
			renderNotebookList();
			renderNoteList();
		});
	});

	function initEditor(article) {
		mdEditor = editormd("content", {
			height : 640,
			path   : "https://cdn.jsdelivr.net/npm/editor.md@1.5.0/lib/",
			appendMarkdown : article.contentMD,
			saveHTMLToTextarea : true,
			mode : "markdown",
			tex  : true,
			tocm : true,
			codeFold : true
		});
	}

	function initCategoryOptions(){
		var category = $('#category');
		category.empty();
		if(Array.isArray(categoryJson)){
			for (var i = 0; i < categoryJson.length; i++) {
				category.append('<option value="'+ categoryJson[i] +'">' + categoryJson[i] + '</option>');
			}
		}
		category.selectpicker('render');
		category.selectpicker('refresh');
	}

	function hydrateForm(article){
		$('#id').val(article.id);
		$('#title').val(article.title);
		$('#img').val(article.img);
		$('#link').val(article.link);
		$('#createDate').val((article.createDate || '').replace(" ","T"));
		$('#priority').val(article.priority === undefined ? "0.5" : article.priority);
		$('#changefreq').selectpicker('val', (article.changefreq === undefined ? "daily":article.changefreq));
		$('#category').selectpicker('val', article.category);
		$('#notebookId').val(article.notebookId || '');
		state.selectedNotebookId = article.notebookId && article.notebookId.length ? article.notebookId : NOTEBOOK_UNFILED_ID;
		state.selectedNoteId = article.id;
		setTagList(article.tags);
		setVisibility((article.visibility || 'public') === 'private');
		if(mdEditor){
			mdEditor.setMarkdown(article.contentMD || '');
		}
	}

	function bindUI(){
		$('#tagInput').on('keydown', handleTagInput);
		$('#visibilityToggle').on('change', function(){
			setVisibility($(this).is(':checked'));
		});
		$('#btnNewNotebook').on('click', function(){ openNotebookModal('add'); });
		$('#btnNewNote').on('click', function(){ createNewNote(); });
		$('#notebookModalConfirm').on('click', submitNotebookModal);
		$('#noteModalConfirm').on('click', submitNoteRename);
	}

	function handleTagInput(e){
		var key = e.key || e.keyCode;
		if(key === 'Enter' || key === 13 || key === ',' || key === 188){
			e.preventDefault();
			addTag($(this).val());
			$(this).val('');
		}
		else if((key === 'Backspace' || key === 8) && !$(this).val() && tagState.length){
			tagState.pop();
			renderTagPills();
		}
	}

	function addTag(value){
		var clean = (value || '').trim();
		if(!clean || tagState.indexOf(clean) > -1){
			return;
		}
		tagState.push(clean);
		renderTagPills();
	}

	function setTagList(value){
		if(Array.isArray(value)){
			tagState = value.filter(Boolean);
		}
		else if(typeof value === 'string' && value.length){
			tagState = value.split(',').map(function(item){ return item.trim(); }).filter(Boolean);
		}
		else{
			tagState = [];
		}
		renderTagPills();
	}

	function renderTagPills(){
		var container = $('#tagPillContainer');
		container.empty();
		if(!tagState.length){
			container.append('<span class="text-muted small">暂未添加标签</span>');
		}
		tagState.forEach(function(tag, idx){
			var pill = $('<span class="tag-pill"></span>').text(tag);
			var removeBtn = $('<button type="button" class="tag-remove">&times;</button>');
			removeBtn.on('click', function(e){
				e.preventDefault();
				e.stopPropagation();
				tagState.splice(idx,1);
				renderTagPills();
			});
			pill.append(removeBtn);
			container.append(pill);
		});
		$('#tags').val(tagState.join(','));
	}

	function setVisibility(isPrivate){
		$('#visibilityToggle').prop('checked', isPrivate);
		$('#visibility').val(isPrivate ? 'private' : 'public');
		if(isPrivate){
			$('#visibilityLabel').removeClass('label-success').addClass('label-warning').text('私密');
			$('#privacyMessage').text('仅通过后台登录后可访问，访客将无法查看。');
		}else{
			$('#visibilityLabel').removeClass('label-warning').addClass('label-success').text('公开');
			$('#privacyMessage').text('公开文章任何人均可访问，无需登录。');
		}
	}

	function loadNotebooks(){
		return $.getJSON('/admin/notebook/list/').done(function(res){
			if(res && res.notebooks){
				state.notebooks = res.notebooks;
				var hasCurrent = state.notebooks.some(function(nb){ return nb.id === state.selectedNotebookId; });
				if(!hasCurrent && state.notebooks.length){
					state.selectedNotebookId = state.notebooks[0].id;
				}
				renderNotebookList();
			}
		});
	}

	function renderNotebookList(){
		var container = $('#notebookList');
		container.empty();
		$('#notebookEmpty').toggle(!state.notebooks.length);
		state.notebooks.forEach(function(nb){
			var item = $('<div class="notebook-item"></div>');
			if(nb.id === state.selectedNotebookId){
				item.addClass('active');
			}
			item.append('<div><strong>'+ nb.title +'</strong></div>');
			item.append('<div class="meta">'+ (nb.noteCount || 0) +' 篇'+ (nb.updatedAt ? ' · '+ nb.updatedAt.split('T')[0] : '') +'</div>');
			item.on('click', function(){ selectNotebook(nb.id); });
			if(nb.id !== NOTEBOOK_UNFILED_ID){
				var actions = $('<div class="notebook-actions"></div>');
				var renameBtn = $('<button type="button" class="btn btn-link btn-xs">重命名</button>').on('click', function(e){ e.stopPropagation(); openNotebookModal('rename', nb); });
				var deleteBtn = $('<button type="button" class="btn btn-link btn-xs text-danger">删除</button>').on('click', function(e){ e.stopPropagation(); deleteNotebook(nb.id); });
				actions.append(renameBtn).append(deleteBtn);
				item.append(actions);
			}
			container.append(item);
		});
	}

	function selectNotebook(notebookId){
		state.selectedNotebookId = notebookId;
		renderNotebookList();
		loadNotes(notebookId).then(function(){
			renderNoteList();
		});
	}

	function loadNotes(notebookId){
		var target = notebookId || NOTEBOOK_UNFILED_ID;
		return $.getJSON('/admin/note/list/' + target + '/').done(function(res){
			state.notes = (res && res.notes) ? res.notes : [];
			$('#currentNotebookTitle').text(getNotebookTitleById(state.selectedNotebookId));
		});
	}

	function renderNoteList(){
		var list = $('#noteList');
		list.empty();
		if(!state.notes.length){
			$('#noteEmpty').show();
			return;
		}
		$('#noteEmpty').hide();
		state.notes.forEach(function(note){
			var item = $('<div class="note-item"></div>');
			if(note.id === state.selectedNoteId){ item.addClass('active'); }
			var badge = note.visibility === 'private' ? ' <span class="label label-warning">私密</span>' : '';
			item.append('<div><strong>'+ note.title +'</strong>'+ badge +'</div>');
			item.append('<div class="meta">'+ (note.createDate ? note.createDate.replace('T',' ') : '') +'</div>');
			var actions = $('<div class="note-actions"></div>');
			actions.append($('<button type="button" class="btn btn-link btn-xs">重命名</button>').on('click', function(e){ e.stopPropagation(); openNoteModal(note); }));
			actions.append($('<button type="button" class="btn btn-link btn-xs text-danger">删除</button>').on('click', function(e){ e.stopPropagation(); deleteArticle(note.id); }));
			item.append(actions);
			item.on('click', function(){ loadArticle(note.id); });
			list.append(item);
		});
	}

	function getNotebookTitleById(id){
		for(var i=0;i<state.notebooks.length;i++){
			if(state.notebooks[i].id === id){
				return state.notebooks[i].title;
			}
		}
		return '未归档笔记';
	}

	function openNotebookModal(mode, notebook){
		$('#notebookModalLabel').text(mode === 'rename' ? '重命名文集' : '新建文集');
		$('#notebookNameInput').val(notebook ? notebook.title : '');
		$('#notebookModal').data('mode', mode).data('targetId', notebook ? notebook.id : null).modal('show');
	}

	function submitNotebookModal(){
		var mode = $('#notebookModal').data('mode');
		var title = $('#notebookNameInput').val().trim();
		if(!title){
			alert('请输入文集名称');
			return;
		}
		var targetId = $('#notebookModal').data('targetId');
		var url = '/admin/notebook/add/';
		if(mode === 'rename'){
			url = '/admin/notebook/rename/' + targetId + '/';
		}
		$.ajax({
			url: url,
			type: 'POST',
			dataType: 'json',
			contentType: 'application/json; charset=utf-8',
			data: JSON.stringify({ title: title }),
			success: function(res){
				if(res && res.rst){
					$('#notebookModal').modal('hide');
					loadNotebooks().then(function(){ renderNotebookList(); });
				}else{
					alert((res && res.msg) || '操作失败');
				}
			}
		});
	}

	function deleteNotebook(id){
		if(!confirm('删除文集后无法恢复，继续吗？')){ return; }
		$.ajax({
			url: '/admin/notebook/delete/' + id + '/',
			type: 'POST',
			dataType: 'json',
			success: function(res){
				if(res && res.rst){
					loadNotebooks().then(function(){
						if(state.selectedNotebookId === id){
							state.selectedNotebookId = NOTEBOOK_UNFILED_ID;
							loadNotes(state.selectedNotebookId).then(renderNoteList);
						}
					});
				}else{
					alert((res && res.msg) || '删除失败');
				}
			}
		});
	}

	function openNoteModal(note){
		$('#noteModalLabel').text('重命名笔记');
		$('#noteTitleInput').val(note ? note.title : '');
		$('#noteModal').data('targetId', note ? note.id : null).modal('show');
	}

	function submitNoteRename(){
		var noteId = $('#noteModal').data('targetId');
		var title = $('#noteTitleInput').val().trim();
		if(!title){
			alert('请输入笔记标题');
			return;
		}
		$.ajax({
			url: '/admin/note/rename/' + noteId + '/',
			type: 'POST',
			dataType: 'json',
			contentType: 'application/json; charset=utf-8',
			data: JSON.stringify({ title: title }),
			success: function(res){
				if(res && res.rst){
					$('#noteModal').modal('hide');
					loadNotes(state.selectedNotebookId).then(function(){
						renderNoteList();
						if(state.selectedNoteId === noteId){
							$('#title').val(title);
						}
					});
				}else{
					alert((res && res.msg) || '重命名失败');
				}
			}
		});
	}

	function createNewNote(){
		var payload = {
			notebookId: state.selectedNotebookId,
			title: '未命名笔记'
		};
		$.ajax({
			url: '/admin/note/quickAdd/',
			type: 'POST',
			dataType: 'json',
			contentType: 'application/json; charset=utf-8',
			data: JSON.stringify(payload),
			success: function(res){
				if(res && res.rst && res.note){
					state.selectedNotebookId = res.note.notebookId && res.note.notebookId.length ? res.note.notebookId : NOTEBOOK_UNFILED_ID;
					state.selectedNoteId = res.note.id;
					loadNotebooks().then(function(){ return loadNotes(state.selectedNotebookId); }).then(function(){
						renderNotebookList();
						renderNoteList();
						loadArticle(res.note.id);
						openNoteModal({ id: res.note.id, title: res.note.title });
					});
				}else{
					alert((res && res.msg) || '创建失败');
				}
			}
		});
	}

	function loadArticle(articleId){
		if(!articleId){ return; }
		$.getJSON('/admin/api/article/' + articleId + '/').done(function(res){
			if(res && res.article){
				applyArticle(res.article);
				state.selectedNoteId = res.article.id;
				state.selectedNotebookId = res.article.notebookId && res.article.notebookId.length ? res.article.notebookId : NOTEBOOK_UNFILED_ID;
				renderNotebookList();
				renderNoteList();
			}else{
				alert((res && res.msg) || '无法加载笔记');
			}
		});
	}

	function applyArticle(article){
		$('#id').val(article.id);
		$('#title').val(article.title);
		$('#img').val(article.img);
		$('#link').val(article.link);
		$('#createDate').val((article.createDate || '').replace(" ","T"));
		$('#priority').val(article.priority === undefined ? "0.5" : article.priority);
		$('#changefreq').selectpicker('val', (article.changefreq === undefined ? "daily":article.changefreq));
		$('#category').selectpicker('val', article.category);
		$('#notebookId').val(article.notebookId || '');
		setTagList(article.tags);
		setVisibility((article.visibility || 'public') === 'private');
		if(mdEditor){
			mdEditor.setMarkdown(article.contentMD || '');
		}
	}

	function syncTagInput(){
		$('#tags').val(tagState.join(','));
	}

	function clearEditor(){
		$('#editForm')[0].reset();
		setTagList([]);
		setVisibility(false);
		if(mdEditor){
			mdEditor.setMarkdown('');
		}
	}

	function saveEdit(){
		syncTagInput();
		$.ajax({
			type: "POST",
			dataType: "json",
			contentType: "application/json; charset=utf-8",
			url: "/admin/saveEdit/",
			data: JSON.stringify($("#editForm").serializeArray()),
			success: function (result) {
				alert(result.msg);
				if(result.rst){
					state.selectedNoteId = $('#id').val();
					loadNotes(state.selectedNotebookId).then(renderNoteList);
				}
			}
		});
	}

	function deleteArticle(targetId){
		var articleId = targetId || $('#id').val();
		if(!articleId){ return; }
		if (confirm("确定删除吗?删除后重新发布才能生效")==false){
			return;
		}
		$.ajax({
			type: "POST",
			dataType: "json",
			contentType: "application/json; charset=utf-8",
			url: "/admin/delete/"+articleId +"/",
			data: [{"id": articleId}],
			success: function (result) {
				alert(result.msg);
				if(result.rst){
					if(state.selectedNoteId === articleId){
						state.selectedNoteId = null;
						clearEditor();
					}
					loadNotes(state.selectedNotebookId).then(renderNoteList);
				}
			}
		});
	}
</script>
  
</body>

</html>
